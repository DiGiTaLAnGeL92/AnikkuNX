name: Build AnikkuNX

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build AnikkuNX.nro
        run: docker run --rm -v "$PWD":/data devkitpro/devkita64 bash /data/switch/scripts/build_switch.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AnikkuNX-nro
          path: dist/AnikkuNX.nro

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AnikkuNX.nro
          generate_release_notes: true
